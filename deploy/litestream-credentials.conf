# A drop-in for the litestream package's service, installed as
# /etc/systemd/system/litestream.service.d/credentials.conf. /etc/litestream.env (owner
# root, mode 0600) holds the two lines
#
#   LITESTREAM_ACCESS_KEY_ID=...
#   LITESTREAM_SECRET_ACCESS_KEY=...

[Service]
EnvironmentFile=/etc/litestream.env
