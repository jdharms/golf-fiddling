[project]
name = "golf-fiddling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.0",
    "py65>=1.2.0",
    "pillow>=12.0.0",
    "plyer>=2.1.0",
    "pygame>=2.6.1",
]

[project.scripts]
# Course editor
golf-editor = "editor.main:main"

# Course data: dump, write, render
golf-dump = "tools.dump:main"
golf-dump-jp = "tools.dump_jp_courses:main"
golf-write = "tools.write:main"
golf-visualize = "tools.visualize:main"
golf-render-web = "tools.render_web:main"

# Regenerate checked-in data/ files
golf-extract-tables = "tools.data.extract_tables:main"
golf-analyze-neighbors = "tools.data.analyze_neighbors:main"
golf-analyze-greens-neighbors = "tools.data.analyze_greens_neighbors:main"
golf-analyze-putting = "tools.data.analyze_putting_surface:main"

# Utilities
golf-hex2bin = "tools.hex2bin:main"
golf-expand-dict = "tools.expand_dict:main"

# ROM patches
golf-patch-wram = "tools.patch_wram:main"
golf-patch-seeded-wind = "tools.patch_seeded_wind:main"
golf-patch-music = "tools.patch_music:main"
golf-patch-practice-swing = "tools.patch_practice_swing:main"
golf-patch-signpost = "tools.patch_signpost:main"
golf-patch-qr = "tools.patch_qr:main"

# Reverse-engineering research
golf-rom-peek = "tools.research.rom_peek:main"
golf-labels = "tools.research.labels:main"

# Art round-trips
golf-golfer-export = "tools.art.golfer_export:main"
golf-signpost-import = "tools.art.signpost_import:main"

# Music
golf-export-music = "tools.music.export:main"

# Scorecard QR
golf-qr-preview = "tools.qr.preview:main"
golf-qr-validate = "tools.qr.validate:main"
golf-qr-tables = "tools.qr.tables:main"
golf-qr-port = "tools.qr.port:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=golf",
    "--cov=editor",
    "--cov-report=term-missing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pyright>=1.1.407",
    "ruff>=0.14.10",
    "pyinstaller>=6.18.0",
    "zxing-cpp>=3.1.1",
    "opencv-python-headless>=5.0.0.93",
    "qrcode>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["golf", "editor", "tools"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sorting
    "N", # pep-8 naming
    "UP", # pyupgrade
    "B", # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (let autoformatting handle)
]

[tool.pyright]
venvPath = "."
venv = ".venv"
