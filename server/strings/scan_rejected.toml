# Scan rejection strings (scan_rejected.html): what a phone shows when a scan of the
# end-of-round QR code could not be recorded. The round page is round.toml.
# Format: see common.toml, and server/CLAUDE.md "Player-facing text".

[scan_rejected.page_title]
note = "plain: browser tab title, a scan that could not be recorded"
text = "Scan Rejected - NES Open Randomizer"

[scan_rejected.heading]
note = "h1, the scan could not be recorded"
text = "Scan Rejected"

[scan_rejected.malformed]
note = "the link isn't a complete scorecard code: mistyped, cut off, or not from a randomizer ROM; try scanning again"
text = """
The QR code you scanned appears to be malformed.
Try scanning again, if it still doesn't work, take a screenshot and report it."""

[scan_rejected.unfinished]
note = "the code came from a ROM that was never finished with a player's credentials (built outside the site's download); only ROMs downloaded while signed in can submit"
text = """
This code appears to be from a ROM that wasn't generated by the randomizer website.
Only ROMs downloaded while signed-in can be submitted.  If this is a mistake, report it."""

[scan_rejected.unrecognized]
note = "the code doesn't match any player's entry for a seed: not downloaded signed in from this site, or altered; deliberately doesn't say which"
text = """
This code isn't recognized, nothing has been recorded.
"""
